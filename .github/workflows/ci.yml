name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The e2e suite drives the real app against a throwaway database, so it
      # needs a live MongoDB rather than a stub.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite skips its client-bundle assertions when dist is absent, so the
      # build runs first to make those checks count in CI.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the production image builds
        run: docker build -t hec-api:ci .
